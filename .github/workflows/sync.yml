name: Sync bookmarks

on:
  # GitHub cron is UTC only. 08:00 Sydney is 21:00 UTC in summer (AEDT)
  # and 22:00 UTC in winter (AEST), so schedule both and let `gate` keep one.
  schedule:
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: Also read every bookmark folder
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Australia/Sydney date +%z)
          if [ "$EVENT" != "schedule" ] \
            || { [ "$offset" = "+1100" ] && [ "$SCHEDULE" = "0 21 * * *" ]; } \
            || { [ "$offset" = "+1000" ] && [ "$SCHEDULE" = "0 22 * * *" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Sync
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            bun run sync --backfill
          else
            bun run sync
          fi
      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes in data/"
            exit 0
          fi
          git commit -m "Update bookmark snapshot"
          git push
